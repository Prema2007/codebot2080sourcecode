name: CODE Bot Azure Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codebot2080-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Download the latest GitHub source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Validate secrets and application files
      - name: Validate deployment configuration
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          APP_PATH: ${{ secrets.AZURE_APP_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$VM_HOST" || {
            echo "::error::AZURE_VM_HOST is missing."
            exit 1
          }

          test -n "$VM_USER" || {
            echo "::error::AZURE_VM_USER is missing."
            exit 1
          }

          test -n "$APP_PATH" || {
            echo "::error::AZURE_APP_PATH is missing."
            exit 1
          }

          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::AZURE_VM_SSH_KEY is missing."
            exit 1
          }

          test "$APP_PATH" = "/var/www/codebot2080" || {
            echo "::error::Unexpected application path."
            exit 1
          }

          test -f package.json
          test -f package-lock.json
          test -f index.js

          echo "Deployment configuration validated."

      # Step 3: Prepare SSH
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/azure_vm_key"

          chmod 600 "$HOME/.ssh/azure_vm_key"

          ssh-keygen -y \
            -f "$HOME/.ssh/azure_vm_key" \
            > /dev/null

          # Verify that the VM's SSH port is reachable.
          timeout 10 bash -c \
            'echo > /dev/tcp/$1/22' _ "$VM_HOST" || {
              echo "::error::SSH port 22 is unreachable. Check Azure NSG and VM firewall."
              exit 1
            }

          # Learn the server host key for this connection.
          ssh-keyscan -T 10 -H "$VM_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed."

      # Step 4: Verify SSH access and deployment prerequisites
      - name: Verify Azure VM
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          APP_PATH: ${{ secrets.AZURE_APP_PATH }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/azure_vm_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "bash -s -- '$APP_PATH'" <<'REMOTE'
          set -euo pipefail

          APP_PATH="$1"

          echo "Connected user: $(whoami)"
          echo "Server: $(hostname)"

          test -d "$APP_PATH" || {
            echo "Application directory does not exist."
            exit 1
          }

          test -f "$APP_PATH/.env" || {
            echo "Application .env file is missing."
            exit 1
          }

          command -v node
          command -v npm

          echo "Checking deployment service..."
          systemctl is-enabled codebot2080.service

          echo "VM prerequisites validated."
          REMOTE

      # Step 5: Package source without secrets or node_modules
      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail

          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.db_password' \
            --exclude='*.log' \
            -czf "$RUNNER_TEMP/codebot2080.tar.gz" \
            -C "$GITHUB_WORKSPACE" .

          echo "Deployment package created."

      # Step 6: Upload the source package
      - name: Upload package to Azure VM
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -euo pipefail

          scp \
            -i "$HOME/.ssh/azure_vm_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/codebot2080.tar.gz" \
            "$VM_USER@$VM_HOST:/tmp/codebot2080-deploy.tar.gz"

          echo "Package uploaded."

      # Step 7: Update application and restart the service
      - name: Deploy and restart application
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          APP_PATH: ${{ secrets.AZURE_APP_PATH }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/azure_vm_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "bash -s -- '$APP_PATH'" <<'REMOTE'
          set -euo pipefail

          APP_PATH="$1"
          PACKAGE="/tmp/codebot2080-deploy.tar.gz"

          test -f "$PACKAGE"
          test -f "$APP_PATH/.env"

          # Update application files while preserving server secrets.
          tar \
            --no-same-owner \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.db_password' \
            --exclude='node_modules' \
            -xzf "$PACKAGE" \
            -C "$APP_PATH"

          rm -f "$PACKAGE"

          cd "$APP_PATH"

          # Install dependencies based on package-lock.json.
          npm ci --omit=dev

          # Restart the preconfigured systemd service.
          sudo -n systemctl restart codebot2080.service

          # Confirm the service is active.
          sudo -n systemctl is-active --quiet codebot2080.service

          echo "Application deployment completed."
          REMOTE

      # Step 8: Check the application health endpoint
      - name: Verify application health
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/azure_vm_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "Checking application on port 8000..."

          for attempt in $(seq 1 12); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              http://127.0.0.1:8000/; then
              echo
              echo "Application health check passed."
              exit 0
            fi

            echo "Attempt $attempt failed; retrying..."
            sleep 5
          done

          echo "Application health check failed."
          sudo -n journalctl \
            -u codebot2080.service \
            -n 80 \
            --no-pager || true

          exit 1
          REMOTE

      # Step 9: Clean up temporary SSH key
      - name: Clean up SSH key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/azure_vm_key"
