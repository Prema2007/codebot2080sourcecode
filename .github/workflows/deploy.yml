name: CODE Bot Azure Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: codebot2080-production
  cancel-in-progress: false

jobs:
  test-connection:
    name: Test Azure VM SSH and Repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          APP_PATH: ${{ secrets.AZURE_APP_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$VM_HOST" || {
            echo "::error::AZURE_VM_HOST is missing."
            exit 1
          }

          test -n "$VM_USER" || {
            echo "::error::AZURE_VM_USER is missing."
            exit 1
          }

          test -n "$APP_PATH" || {
            echo "::error::AZURE_APP_PATH is missing."
            exit 1
          }

          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::AZURE_VM_SSH_KEY is missing."
            exit 1
          }

          echo "Required secrets are present."
          echo "SSH username: $VM_USER"
          echo "Application path: $APP_PATH"

      - name: Validate repository files
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json || {
            echo "::error::package.json is missing from the repository root."
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::package-lock.json is missing from the repository root."
            exit 1
          }

          test -f index.js || {
            echo "::error::index.js is missing from the repository root."
            exit 1
          }

          echo "Required Node.js application files are present."

      - name: Validate SSH key and connect to Azure VM
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          APP_PATH: ${{ secrets.AZURE_APP_PATH }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          KEY_FILE="$HOME/.ssh/azure_vm_key"

          cleanup() {
            rm -f "$KEY_FILE"
          }
          trap cleanup EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          echo "Validating private key..."
          ssh-keygen -y -f "$KEY_FILE" > /dev/null

          echo "Checking SSH port 22..."
          timeout 10 bash -c 'echo > /dev/tcp/$1/22' _ "$VM_HOST" || {
            echo "::error::Azure VM port 22 is not reachable."
            exit 1
          }

          echo "Obtaining SSH host key..."
          ssh-keyscan -T 10 -H "$VM_HOST" >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "Testing SSH authentication and application directory..."
          ssh \
            -i "$KEY_FILE" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "set -eu
             echo 'SSH authentication successful.'
             whoami
             hostname
             test -d '$APP_PATH'
             echo 'Application directory exists.'
             test -f '$APP_PATH/package.json'
             echo 'Application package.json exists.'
             "

          echo "SSH and application directory checks passed."
