name: CODE Bot Azure Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codebot2080-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Validate repository and GitHub secrets
      - name: Validate deployment configuration
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          APP_PATH: ${{ secrets.AZURE_APP_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$VM_HOST" || {
            echo "::error::AZURE_VM_HOST is missing"
            exit 1
          }

          test -n "$VM_USER" || {
            echo "::error::AZURE_VM_USER is missing"
            exit 1
          }

          test -n "$APP_PATH" || {
            echo "::error::AZURE_APP_PATH is missing"
            exit 1
          }

          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::AZURE_VM_SSH_KEY is missing"
            exit 1
          }

          test "$APP_PATH" = "/var/www/codebot2080" || {
            echo "::error::Unexpected application path"
            exit 1
          }

          test -f package.json
          test -f package-lock.json
          test -f index.js

          echo "Deployment configuration validated."

      # Step 3: Configure SSH
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/azure_vm_key"

          chmod 600 "$HOME/.ssh/azure_vm_key"

          ssh-keygen -y \
            -f "$HOME/.ssh/azure_vm_key" \
            > /dev/null

          timeout 10 bash -c \
            'echo > /dev/tcp/$1/22' _ "$VM_HOST" || {
              echo "::error::SSH port 22 is unreachable"
              exit 1
            }

          ssh-keyscan -T 10 -H "$VM_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed."

      # Step 4: Verify VM, application path and PM2
      - name: Verify Azure VM and PM2
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          APP_PATH: ${{ secrets.AZURE_APP_PATH }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/azure_vm_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "bash -s -- '$APP_PATH'" <<'REMOTE'
          set -euo pipefail

          APP_PATH="$1"

          echo "Connected user: $(whoami)"
          echo "Server: $(hostname)"

          test -d "$APP_PATH"
          test -f "$APP_PATH/.env"
          test -f "$APP_PATH/package.json"
          test -f "$APP_PATH/package-lock.json"
          test -f "$APP_PATH/index.js"

          command -v node
          command -v npm

          # Include common PM2 installation paths.
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/.nvm/versions/node/$(node -v)/bin:/usr/local/bin:/usr/bin:/bin"

          PM2_BIN="$(command -v pm2 || true)"

          if [ -z "$PM2_BIN" ]; then
            echo "Searching for PM2 in the user's NVM installation..."

            PM2_BIN="$(find "$HOME/.nvm/versions/node" \
              -type f -path '*/bin/pm2' -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$PM2_BIN" ] || [ ! -x "$PM2_BIN" ]; then
            echo "::error::PM2 executable was not found for this user."
            exit 1
          fi

          echo "PM2 executable: $PM2_BIN"

          "$PM2_BIN" describe codebot

          echo "Checking current application health..."

          curl --fail --silent --show-error \
            --max-time 5 \
            http://127.0.0.1:8000/

          echo
          echo "VM and PM2 checks passed."
          REMOTE

      # Step 5: Create source package without secrets
      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail

          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.db_password' \
            --exclude='*.log' \
            -czf "$RUNNER_TEMP/codebot2080.tar.gz" \
            -C "$GITHUB_WORKSPACE" .

          echo "Deployment package created."

      # Step 6: Upload package to the VM
      - name: Upload package to Azure VM
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -euo pipefail

          scp \
            -i "$HOME/.ssh/azure_vm_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/codebot2080.tar.gz" \
            "$VM_USER@$VM_HOST:/tmp/codebot2080-deploy.tar.gz"

          echo "Package uploaded successfully."

      # Step 7: Deploy source and restart PM2 application
      - name: Deploy and restart application
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          APP_PATH: ${{ secrets.AZURE_APP_PATH }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/azure_vm_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "bash -s -- '$APP_PATH'" <<'REMOTE'
          set -euo pipefail

          APP_PATH="$1"
          PACKAGE="/tmp/codebot2080-deploy.tar.gz"

          test -f "$PACKAGE"
          test -f "$APP_PATH/.env"

          # Preserve server-specific environment and dependencies.
          tar \
            --no-same-owner \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.db_password' \
            --exclude='node_modules' \
            -xzf "$PACKAGE" \
            -C "$APP_PATH"

          rm -f "$PACKAGE"

          cd "$APP_PATH"

          # Make PM2 available in non-interactive SSH sessions.
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/.nvm/versions/node/$(node -v)/bin:/usr/local/bin:/usr/bin:/bin"

          PM2_BIN="$(command -v pm2 || true)"

          if [ -z "$PM2_BIN" ]; then
            PM2_BIN="$(find "$HOME/.nvm/versions/node" \
              -type f -path '*/bin/pm2' -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$PM2_BIN" ] || [ ! -x "$PM2_BIN" ]; then
            echo "::error::PM2 executable was not found."
            exit 1
          fi

          # Confirm the existing PM2 application before changing dependencies.
          "$PM2_BIN" describe codebot

          # Install dependencies from the lock file.
          npm ci --omit=dev

          # Restart the existing PM2 application.
          "$PM2_BIN" restart codebot --update-env

          # Verify PM2 reports the application online.
          "$PM2_BIN" describe codebot

          echo "Deployment and PM2 restart completed."
          REMOTE

      # Step 8: Verify application health
      - name: Verify application health
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/azure_vm_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "Checking application on port 8000..."

          for attempt in $(seq 1 12); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              http://127.0.0.1:8000/; then

              echo
              echo "Application health check passed."
              exit 0
            fi

            echo "Attempt $attempt failed; retrying..."
            sleep 5
          done

          echo "::error::Application health check failed."

          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/.nvm/versions/node/$(node -v)/bin:/usr/local/bin:/usr/bin:/bin"

          PM2_BIN="$(command -v pm2 || true)"

          if [ -n "$PM2_BIN" ]; then
            "$PM2_BIN" logs codebot --lines 50 --nostream || true
          fi

          exit 1
          REMOTE

      # Step 9: Remove temporary SSH key
      - name: Clean up SSH key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/azure_vm_key"
